name: Build Laiba Android APK

on:
  push:
    branches: [laiba-self-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      P4A_RELEASE_KEYSTORE: /tmp/laiba-release.jks
      P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout Laiba Project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config cmake zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 libffi-dev libssl-dev build-essential

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip "requests>=2.31,<3"

      - name: Run complete unit and integration test suite
        run: python -m unittest discover -s tests -v

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 Cython==0.29.36

      - name: Prepare Android Build Configuration
        run: |
          sed -i '/^android\.ndk_path[[:space:]]*=/d' buildozer.spec
          sed -i '/^p4a\.source_dir[[:space:]]*=/d' buildozer.spec

      - name: Restore private Android signing key
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$P4A_RELEASE_KEYSTORE_PASSWD"
          test -n "$P4A_RELEASE_KEYALIAS"
          test -n "$P4A_RELEASE_KEYALIAS_PASSWD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$P4A_RELEASE_KEYSTORE"
          test -s "$P4A_RELEASE_KEYSTORE"
          chmod 600 "$P4A_RELEASE_KEYSTORE"

      - name: Build Laiba APK
        run: buildozer -v android release

      - name: Verify APK signature
        run: |
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --verbose "$APK"

      - name: Generate HTTPS update manifest
        run: |
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          HASH="$(sha256sum "$APK" | cut -d' ' -f1)"
          NAME="$(basename "$APK")"
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' buildozer.spec | head -n1)"
          test -n "$VERSION"
          printf '{"version":"%s","changelog":"Laiba self-update release %s","apk_url":"https://github.com/Moeenkhan370/Laiba-Assistant/releases/download/laiba-development-latest/%s","sha256":"%s"}\n' "$VERSION" "$VERSION" "$NAME" "$HASH" > update_manifest.json

      - name: Upload Laiba APK
        uses: actions/upload-artifact@v4
        with:
          name: Laiba-Assistant-APK
          path: |
            bin/*.apk
            update_manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/laiba-self-development'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: laiba-development-latest
          name: Laiba Development APK
          prerelease: true
          make_latest: false
          files: |
            bin/*.apk
            update_manifest.json
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
