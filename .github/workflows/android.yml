name: Build Laiba Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Laiba Project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 Cython==0.29.36

      - name: Prepare Android Build Configuration
        run: |
          sed -i '/^android\.ndk_path[[:space:]]*=/d' buildozer.spec
          sed -i '/^p4a\.source_dir[[:space:]]*=/d' buildozer.spec
          echo "===== BUILD CONFIGURATION ====="
          grep -E '^(android.api|android.ndk|android.minapi|android.archs|p4a.branch)' buildozer.spec

      - name: Build Laiba APK
        run: |
          buildozer -v android debug

      - name: Upload Laiba APK
        uses: actions/upload-artifact@v4
        with:
          name: Laiba-Assistant-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
