name: Build Laiba Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout Laiba Project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Build Dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            echo "APT attempt $attempt of 5"
            if sudo apt-get update && sudo apt-get install -y \
              git zip unzip autoconf automake libtool \
              pkg-config cmake zlib1g-dev libncurses5-dev \
              libncursesw5-dev libtinfo6 libffi-dev libssl-dev \
              build-essential; then
              exit 0
            fi
            echo "APT failed. Retrying in 20 seconds..."
            sleep 20
          done
          echo "APT installation failed after 5 attempts."
          exit 1

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip "requests>=2.31,<3"

      - name: Run complete unit and integration test suite
        run: python -m unittest discover -s tests -v

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 Cython==0.29.36

      - name: Prepare Android Build Configuration
        run: |
          sed -i '/^android\.ndk_path[[:space:]]*=/d' buildozer.spec
          sed -i '/^p4a\.source_dir[[:space:]]*=/d' buildozer.spec
          echo "===== BUILD CONFIGURATION ====="
          grep -E '^(android.api|android.ndk|android.minapi|android.archs|p4a.branch)' buildozer.spec

      - name: Build Laiba APK
        run: |
          buildozer -v android debug

      - name: Prepare and verify private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/laiba-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/laiba-signing/laiba-release.jks"
          chmod 600 "$RUNNER_TEMP/laiba-signing/laiba-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/laiba-signing/laiba-release.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          ACTUAL="$(keytool -list -v -keystore "$RUNNER_TEMP/laiba-signing/laiba-release.jks" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':')"
          EXPECTED="FC1F0FB67EEC5260DD113EFA87161540F9E380BCDE9FF27C216EFEA86D044FFA"
          test "$ACTUAL" = "$EXPECTED" || { echo "Signing certificate fingerprint mismatch"; exit 1; }
          echo "Signing keystore and certificate verified."

      - name: Align, sign and verify APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_COUNT="$(find bin -maxdepth 1 -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -eq 1
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n1)"
          APKSIGNER="$(find "$HOME/.buildozer" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          ZIPALIGN="${APKSIGNER%/apksigner}/zipalign"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -f 4 "$APK" "$RUNNER_TEMP/laiba-signing/aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/laiba-signing/laiba-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$RUNNER_TEMP/laiba-signing/signed.apk" "$RUNNER_TEMP/laiba-signing/aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/laiba-signing/signed.apk" | tee "$RUNNER_TEMP/laiba-signing/verification.txt"
          ACTUAL="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/laiba-signing/verification.txt" | head -n1 | tr -d ':')"
          EXPECTED="FC1F0FB67EEC5260DD113EFA87161540F9E380BCDE9FF27C216EFEA86D044FFA"
          test "$ACTUAL" = "$EXPECTED" || { echo "Signed APK certificate fingerprint mismatch"; exit 1; }
          mv "$RUNNER_TEMP/laiba-signing/signed.apk" "$APK"
          echo "APK signature and certificate fingerprint verified."

      - name: Generate HTTPS update manifest
        run: |
          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK"
          HASH="$(sha256sum "$APK" | cut -d' ' -f1)"
          NAME="$(basename "$APK")"
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' buildozer.spec | head -n1)"
          test -n "$VERSION"
          printf '{"version":"%s","changelog":"Laiba self-update release %s","apk_url":"https://github.com/Moeenkhan370/Laiba-Assistant/releases/download/laiba-development-latest/%s","sha256":"%s"}\n' "$VERSION" "$VERSION" "$NAME" "$HASH" > update_manifest.json

      - name: Upload Laiba APK
        uses: actions/upload-artifact@v4
        with:
          name: Laiba-Assistant-APK
          path: |
            bin/*.apk
            update_manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/laiba-self-development'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: laiba-development-latest
          name: Laiba Development APK
          prerelease: true
          make_latest: false
          files: |
            bin/*.apk
            update_manifest.json
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
